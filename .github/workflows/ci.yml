name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
      - "codex/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node --check scripts/setup-ranked-meta.mjs
      - run: node scripts/setup-ranked-meta.mjs --help
      - run: pnpm cf:build
      - run: pnpm exec wrangler deploy --dry-run --outdir .wrangler-dry-run
